[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "x402-validator-tools"
version = "0.1.0"
description = "Dashboard, API server, and monetization tools for x402-validator"
readme = "README.md"
license = "Apache-2.0"
keywords = ["x402", "validator", "dashboard", "stripe", "monetization"]
authors = [
    {name = "Gael L Chulim", email = "mssali-ai@github.com"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.100",
    "uvicorn>=0.20",
    "stripe>=7.0",
    "flask>=3.0",
    "jinja2>=3.1",
    "x402-validator>=0.2",
]

[project.urls]
homepage = "https://github.com/MSSATANASS/x402-validator-tools"
repository = "https://github.com/MSSATANASS/x402-validator-tools"

[tool.setuptools.packages.find]
include = ["dashboard*"]

[tool.setuptools]
include-package-data = true
package-data = {"dashboard" = ["templates/*.html"]}
