# Fly.io configuration for the public FastAPI API.
# Secrets stay in Fly.io's secret store and are intentionally not listed here.

app = "x402-validator-tools"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  COMPONENT = "api"
  ENVIRONMENT = "production"
  HOST = "0.0.0.0"
  LOG_FORMAT = "json"
  PORT = "8080"
  PUBLIC_URL = "https://x402-validator-tools.fly.dev"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    soft_limit = 20

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256
