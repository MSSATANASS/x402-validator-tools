name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege at the workflow level: read-only access to the source.
# The pytest job widens its own scope to mint an OIDC token so Codecov can
# authenticate without a stored CODECOV_TOKEN secret.
permissions:
  contents: read

jobs:
  pytest:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout
      id-token: write # OIDC token for tokenless Codecov upload
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install upstream engine
        run: |
          pip install --upgrade pip
          pip install "x402-validator>=0.3.0"

      - name: Install tools repo
        run: |
          pip install -e ".[dev]"

      - name: Run tests
        run: |
          pytest tests/ --cov=. --cov-report=term-missing --cov-report=xml -v

      - name: Verify CLI entry points
        run: |
          x402-api --help || true
          x402-dashboard --help || true

      # Tokenless upload: codecov-action requests the GitHub OIDC token (hence
      # id-token: write above) instead of reading a long-lived CODECOV_TOKEN.
      - name: Upload coverage
        uses: codecov/codecov-action@v5
        with:
          use_oidc: true
          files: ./coverage.xml
          fail_ci_if_error: false
