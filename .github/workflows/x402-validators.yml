name: x402 Validators CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.10, 3.11]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e .[dev]
      - name: Run pytest
        run: |
          python -m pytest -q
      - name: Run validators (example)
        run: |
          # Run example validators as a smoke check
          python -c "from examples import x402_validators as v; print('manifest-check:', v.validate_manifest_shape({'x402Version':'1','accepts':[{'scheme':'exact','network':'eip155:1','asset':'USDC','payTo':'0x0'}],'resource':'/'}))"
