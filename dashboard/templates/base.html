<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>x402 Validator Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, -apple-system, sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; }
    .container { max-width: 1100px; margin: 0 auto; padding: 2rem; }
    h1 { font-size: 1.75rem; margin-bottom: 0.5rem; color: #f1f5f9; }
    .subtitle { color: #94a3b8; margin-bottom: 2rem; }
    nav { display: flex; gap: 1rem; margin-bottom: 2rem; }
    nav a { color: #38bdf8; text-decoration: none; font-weight: 500; }
    nav a:hover { text-decoration: underline; }
    .card { background: #1e293b; border: 1px solid #334155; border-radius: 0.75rem; padding: 1.5rem; margin-bottom: 1.5rem; }
    .badge { display: inline-block; padding: 0.2rem 0.6rem; border-radius: 9999px; font-size: 0.75rem; font-weight: 600; }
    .badge-pass { background: #166534; color: #86efac; }
    .badge-fail { background: #7f1d1d; color: #fca5a5; }
    .badge-critical { background: #7f1d1d; color: #fca5a5; }
    .badge-warn { background: #713f12; color: #fde68a; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 0.75rem 0.5rem; border-bottom: 1px solid #334155; }
    th { color: #94a3b8; font-weight: 500; font-size: 0.8rem; text-transform: uppercase; }
    input, button { font-family: inherit; }
    .form-group { display: flex; gap: 0.5rem; }
    .form-group input { flex: 1; padding: 0.6rem 1rem; border-radius: 0.5rem; border: 1px solid #334155; background: #0f172a; color: #e2e8f0; font-size: 0.95rem; }
    .form-group button { padding: 0.6rem 1.5rem; border-radius: 0.5rem; border: none; background: #2563eb; color: #fff; font-weight: 600; cursor: pointer; }
    .form-group button:hover { background: #1d4ed8; }
    .chart-box { max-height: 300px; }
    a { color: #38bdf8; }
    .url-cell { max-width: 350px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  </style>
</head>
<body>
  <div class="container">
    <h1>x402 Validator Dashboard</h1>
    <p class="subtitle">Real-time endpoint conformance monitoring</p>
    <nav>
      <a href="{{ url_for('index') }}">Home</a>
      <a href="{{ url_for('index') }}">New Validation</a>
    </nav>
    {% block content %}{% endblock %}
  </div>
</body>
</html>
