<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}x402 Dashboard{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header>
    <h1><a href="{{ url_for('index') }}">x402 Dashboard</a></h1>
    <p class="subtitle">Audit history for the x402 conformance engine</p>

  <main>
    {% block content %}{% endblock %}
  </main>

  <footer>
    <p>
      Core validator:
      <a href="https://github.com/smartflowproai-lang/x402-endpoint-validator">smartflowproai-lang/x402-endpoint-validator</a><br>
      Tools repo:
      <a href="https://github.com/MSSATANASS/x402-validator-tools">MSSATANASS/x402-validator-tools</a>
    </p>
  </footer>
</body>
</html>
